name: humq-sample

services:
  web:
    image: humq-sample-web-dev
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      APP_API_URL: ${APP_API_URL:-http://localhost:8000/api}
    command: npm run dev -- --host 0.0.0.0 --port 3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    tty: true

volumes:
  node_modules:
