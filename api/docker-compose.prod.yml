name: humq-sample

services:
  api:
    image: humq-sample-runtime
    build:
      context: .
      target: production
    init: true
    restart: always
    env_file:
      - ./.env
    command:
      - gunicorn
      - app.main:app
      - --worker-class
      - uvicorn_worker.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "${GUNICORN_WORKERS:-4}"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 5

  migrate:
    image: humq-sample-runtime
    build:
      context: .
      target: production
    profiles:
      - tools
    init: true
    env_file:
      - ./.env
    command: alembic upgrade head
    restart: "no"
